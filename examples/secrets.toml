# Secrets and credentials.
#
# Nothing here is compiled into the binary, and installing steer does not turn
# any of it on. Copy what you want into `~/.config/steer/config.toml` or a repo
# `.steer.toml`, and leave the rest.
#
#   steer check --config examples/secrets.toml 'git add .env.production'
#   steer validate --config examples/secrets.toml
#
# `secret-file-read` matches file tools rather than the shell, so it ships
# without `[rules.test]`: examples are shell command lines, and a rule gated on
# another tool cannot declare any. `validate` still compiles it and catches a
# bad glob or an unknown field; what it cannot do is prove it fires.


# A credential read into the transcript is a credential leaked: the transcript
# is written to disk, replayed on resume, and often shipped to a provider. The
# file stays readable by the program that needs it — this only stops a tool
# call from pulling it into context.
#
# `.env.example` and `id_rsa.pub` are the escapes that matter. Both live beside
# the real thing, both are meant to be read, and a rule that denies them gets
# switched off within the hour.
#
# Known ceiling: a glob sees the path, not the contents. Credentials sitting in
# a file named `config.toml` are invisible here, and no pattern over paths will
# find them.
[[rules]]
name = "secret-file-read"
description = "Credential files stay out of the transcript."

[[rules.match]]
tool_name = { any_of = ["read", "edit", "write", "NotebookEdit"] }
path = { glob = ["*.env", "*.env.*", "*.pem", "*.p12", "*.keystore", "*id_rsa*", "*id_ecdsa*", "*id_ed25519*", "*/.aws/credentials", "*/.netrc", "*/.npmrc", "*/.pypirc"], none_glob = ["*.example", "*.sample", "*.template", "*.dist", "*.pub"] }

[rules.action]
kind = "deny"
message = """
This path looks like a credential file, and reading it puts its contents in \
the transcript.

If you need to know whether a key is set, test for it without printing it \
(`test -n "$AWS_SECRET_ACCESS_KEY"`). If you need the file's shape rather \
than its values, read the `.example` next to it.

The program that needs the credential still gets it — this only stops it \
being read into context."""


# Dumping the environment is the same leak by a different route, and it is how
# a model usually gets there: refused the file, it asks the process instead.
#
# The second block is the narrower version of the same move — echoing one
# variable whose name announces what it holds. Matching on the name rather than
# the value is the only option, since the expansion happens in the shell long
# after steer has answered.
#
# Known ceiling, and an instructive one: bare `env` cannot be matched at all.
# `env` is peeled as a wrapper during enrichment — which is what makes
# `env FOO=bar cargo test` arrive as `cargo test` — and with nothing after it
# to peel down to, the call produces no segments for a rule to see. The wrapper
# handling that gives every other rule a clean view costs this one its most
# obvious spelling.
#
# `printenv PATH` passes: naming one variable is a lookup, not a dump.
[[rules]]
name = "no-env-dump"
description = "The environment is full of credentials; printing it leaks them."
tool = "shell"

[[rules.match]]
any = "parsed.segments"
head = { any_of = ["printenv"] }
args = { none_glob = ["*"] }
pipeline_start = { is = true }

[[rules.match]]
any = "parsed.segments"
head = { any_of = ["echo", "printf"] }
args = { matches = '\$\{?[A-Za-z_]*(TOKEN|SECRET|PASSWORD|PASSWD|APIKEY|API_KEY|PRIVATE_KEY|ACCESS_KEY)' }

[rules.action]
kind = "deny"
message = """
Printing the environment writes every credential the process holds into the \
transcript.

To check that a variable is set without revealing it: \
`test -n "$GITHUB_TOKEN" && echo set`."""

[rules.test]
fires = ["printenv", "echo $GITHUB_TOKEN", "printf '%s' \"${AWS_SECRET_ACCESS_KEY}\""]
ignores = ["printenv PATH", "echo $HOME", "echo done"]


# A token passed as an argument is recorded three times over: the transcript,
# the shell history, and the process table, where any other user on the box can
# read it while the command runs.
#
# The alphabet is the whole rule. Every pattern here is a live-credential
# prefix with enough shape to be unmistakable — `AKIA` needs its sixteen-
# character body, `sk-` needs twenty — because the cost of a false positive is
# denying a commit message that happened to mention a key.
#
# Known ceiling: it recognises the issuers it was told about. A bare hex token
# from an internal service has no prefix to match and passes.
[[rules]]
name = "secret-in-argv"
description = "A live token in argv reaches the transcript, the history, and the process table."
tool = "shell"

[[rules.match]]
any = "parsed.segments"
args = { matches = '(ghp_|gho_|ghs_|github_pat_)[A-Za-z0-9]{16}|xox[baprs]-[A-Za-z0-9-]{10}|sk-[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY' }

[rules.action]
kind = "deny"
message = """
That argument carries what looks like a live credential, which puts it in the \
transcript, the shell history, and the process table.

Pass it through the environment instead — `gh` and `aws` both read theirs from \
there — or through a file the command reads, so the value never appears on a \
command line."""

[rules.test]
fires = ["curl -H 'Authorization: Bearer ghp_ABCDEFGHIJKLMNOP' https://api.github.com", "aws configure set aws_access_key_id AKIAIOSFODNN7EXAMPLE"]
ignores = ["git commit -m 'rotate the AKIA keys'", "gh pr list", "echo sk-"]


# The rules above stop a secret being read. This one stops it being fetched:
# every command here exists to print a live credential to stdout, which in a
# hook-driven session means printing it into the transcript.
#
# Three blocks because three shapes. `aws configure get` is a two-token
# subcommand, so it needs `args.0` and `args.1` together. `gcloud` puts the
# tell in a verb anywhere in the line. The rest are secret managers whose read
# verb is the whole command.
#
# Known ceiling, the same one the kubectl rule has: only git's own options are
# peeled, so `aws --profile prod configure get x` shifts `args.0` to `--profile`
# and passes.
[[rules]]
name = "no-credential-print"
description = "These commands exist to print a live credential to stdout."
tool = "shell"

[[rules.match]]
any = "parsed.segments"
head = { any_of = ["aws"] }
"args.0" = { any_of = ["configure"] }
"args.1" = { any_of = ["get"] }

[[rules.match]]
any = "parsed.segments"
head = { any_of = ["gcloud"] }
args = { any_of = ["print-access-token", "print-identity-token"] }

[[rules.match]]
any = "parsed.segments"
head = { any_of = ["op", "pass", "security", "doppler", "vault"] }
"args.0" = { any_of = ["read", "show", "get", "find-generic-password", "find-internet-password"] }

[rules.action]
kind = "deny"
message = """
This prints a live credential, and in this session that means printing it into \
the transcript.

Let the tool that needs it read it directly — `aws` and `gcloud` clients pick \
their own credentials up, and a secret manager can inject into an environment \
(`op run --`, `doppler run --`) without the value ever being displayed."""

[rules.test]
fires = ["aws configure get aws_secret_access_key", "gcloud auth print-access-token", "op read op://vault/api/key"]
ignores = ["aws s3 ls", "gcloud auth list", "op item list", "aws configure list"]


# A credential in a URL is a credential in argv, in the shell history, and
# usually in a log on the other end as well — URLs are the one thing every
# layer of a stack writes down verbatim.
#
# Two shapes: the userinfo form a connection string uses, and the query
# parameter an API key gets pasted into.
#
# `localhost` is not optional here. `postgres://postgres:postgres@localhost/db`
# is in half the dev repos that exist, and denying it teaches nothing.
[[rules]]
name = "no-secret-url"
description = "A credential in a URL is written down by every layer that sees it."
tool = "shell"

[[rules.match]]
any = "parsed.segments"
args = { matches = '://[^/@:[:space:]]+:[^/@[:space:]]+@|[?&](token|api_?key|access_token|auth|password)=[^&[:space:]]', none_glob = ["*localhost*", "*127.0.0.1*"] }

[rules.action]
kind = "deny"
message = """
The credential in this URL reaches the transcript, the shell history, and \
whatever logs the request on the far side.

Split it out: put the password in `PGPASSWORD` or a `.pgpass`, and send an API \
key as a header (`curl -H "Authorization: Bearer $TOKEN"`) with the value \
coming from the environment.

A local connection string keeps working — anything on localhost passes."""

[rules.test]
fires = ["psql postgres://admin:hunter2@db.example.com/app", "curl 'https://api.test/v1/users?api_key=abc123def'"]
ignores = ["psql postgres://postgres:postgres@localhost/app", "curl https://api.test/v1/users", "git clone https://github.com/x/y"]


# The rules above stop a secret reaching the transcript; this one stops it
# reaching the history. A committed key is a rotation, not a revert — the object
# survives the `git rm` that follows.
#
# Known ceiling, and it is a wide one: `git add .` and `git add -A` name no
# file, so there is nothing to match and they pass. This catches the deliberate
# `git add .env.production`, not the sweep that picks it up by accident.
# `.gitignore` is the control for that, and it is a better one.
[[rules]]
name = "no-committing-secrets"
description = "A committed credential has to be rotated, not reverted."
tool = "shell"

[[rules.match]]
any = "parsed.segments"
head = { any_of = ["git"] }
"args.0" = { any_of = ["add", "commit"] }
args = { glob = ["*.env", "*.env.*", "*.pem", "*.p12", "*id_rsa*", "*id_ed25519*"], none_glob = ["*.example", "*.sample", "*.template", "*.pub"] }

[rules.action]
kind = "deny"
message = """
Committing a credential means rotating it: the blob stays in the history after \
the file is removed, and anyone with a clone has it.

Add the path to `.gitignore` instead. If the value is needed by the repo, \
commit a `.example` with the keys and empty values."""

[rules.test]
fires = ["git add .env.production", "git add config/prod.pem"]
ignores = ["git add .env.example", "git add src/main.rs", "git rm --cached .env", "git add id_rsa.pub"]
